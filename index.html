<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Advanced 3D Dogfight Jet Game</title>
    <!-- Loads the unblocked 3D graphics engine -->
    <script src="https://cloudflare.com"></script>
    <style>
      body { margin: 0; overflow: hidden; background-color: #050510; font-family: monospace; user-select: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      
      /* Heads Up Display (HUD) Styling */
      #hud { position: absolute; top: 10px; left: 10px; color: #00ff00; font-size: 18px; text-shadow: 2px 2px #000; pointer-events: none; }
      #bars { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; width: 150px; pointer-events: none; }
      .bar-container { background: rgba(0,0,0,0.5); border: 1px solid #00ff00; height: 12px; position: relative; }
      .bar-fill { height: 100%; width: 100%; transition: width 0.1s; }
      #health-fill { background: #ff0000; }
      #heat-fill { background: #ffff00; width: 0%; }
      .bar-label { position: absolute; font-size: 9px; color: #fff; top: -1px; left: 4px; font-weight: bold; }
      
      /* Crosshair Styling */
      #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid #00ff00; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; transition: border-color 0.1s; }
      #crosshair::before { content: ''; position: absolute; top: 9px; left: -5px; width: 30px; height: 2px; background: #00ff00; }
      #crosshair::after { content: ''; position: absolute; top: -5px; left: 9px; width: 2px; height: 30px; background: #00ff00; }
      
      /* Control Instructions Overlay */
      #controls-guide { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(0, 255, 0, 0.7); text-align: center; font-size: 12px; text-shadow: 1px 1px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Game UI Elements -->
    <div id="hud">SCORE: <span id="score-val">0</span><br>HI-SCORE: <span id="hiscore-val">0</span></div>
    <div id="bars">
      <div class="bar-container"><div id="health-fill" class="bar-fill"></div><div class="bar-label">HULL INTEGRITY</div></div>
      <div class="bar-container"><div id="heat-fill" class="bar-fill"></div><div class="bar-label">WEAPON HEAT</div></div>
    </div>
    <div id="crosshair"></div>
    <div id="controls-guide">STEER: [W,A,S,D] or [ARROW KEYS] &nbsp;&nbsp;|&nbsp;&nbsp; SHOOT: [SPACEBAR]</div>

    <script>
      // --- 1. CORE ENGINE SETUP ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050510); // Deep dark space sky
      scene.fog = new THREE.FogExp2(0x050510, 0.015);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0x88ccff, 1);
      directionalLight.position.set(10, 20, 15);
      scene.add(directionalLight);

      // --- 2. GAME STATE VARIABLE INITIALIZATION ---
      let score = 0;
      let hiScore = localStorage.getItem('dogfight_hiscore') || 0;
      document.getElementById('hiscore-val').innerText = hiScore;
      let playerHealth = 100;
      let weaponHeat = 0;
      let isOverheated = false;

      // --- 3. CREATE PLAYER JET & TRAILS ---
      const jetGroup = new THREE.Group();
      const jetMaterial = new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.3 });
      
      const bodyGeo = new THREE.ConeGeometry(0.4, 2.5, 8);
      bodyGeo.rotateX(Math.PI / 2);
      const jetBody = new THREE.Mesh(bodyGeo, jetMaterial);
      jetGroup.add(jetBody);

      const wingGeo = new THREE.BoxGeometry(3.5, 0.05, 0.8);
      const wing = new THREE.Mesh(wingGeo, jetMaterial);
      wing.position.set(0, -0.1, -0.2);
      jetGroup.add(wing);

      // Afterburner engine trails visual setup
      const trailGeo = new THREE.CylinderGeometry(0.1, 0.01, 1, 4);
      trailGeo.rotateX(Math.PI / 2);
      const trailMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });
      const leftTrail = new THREE.Mesh(trailGeo, trailMat);
      leftTrail.position.set(-0.3, 0, 1.3);
      const rightTrail = new THREE.Mesh(trailGeo, trailMat);
      rightTrail.position.set(0.3, 0, 1.3);
      jetGroup.add(leftTrail, rightTrail);

      scene.add(jetGroup);
      jetGroup.position.set(0, 8, 0);

      // --- 4. CREATE TARGETED ENEMY DRONE ---
      const enemyGeo = new THREE.OctahedronGeometry(1.2, 1);
      const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x330000 });
      const enemy = new THREE.Mesh(enemyGeo, enemyMat);
      scene.add(enemy);
      resetEnemyPosition();

      // --- 5. ENVIRONMENT GENERATION ---
      const floorGeo = new THREE.PlaneGeometry(2000, 2000, 40, 40);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x113322, wireframe: true });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Scatter random glowing rings into the airspace
      const rings = [];
      const ringGeo = new THREE.TorusGeometry(3, 0.2, 8, 24);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
      for(let i=0; i<15; i++) {
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.position.set((Math.random()-0.5)*150, Math.random()*20 + 5, -Math.random()*400 - 50);
          scene.add(ring);
          rings.push(ring);
      }

      // --- 6. ADVANCED KEYBOARD CONTROLS SYSTEM ---
      const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, " ": false };
      let moveVector = { x: 0, y: 0 };
      let isShooting = false;

      window.addEventListener('keydown', (e) => {
          if (e.key in keys) keys[e.key] = true;
          if (e.key === "KeyW") keys['w'] = true;
          if (e.key === "KeyA") keys['a'] = true;
          if (e.key === "KeyS") keys['s'] = true;
          if (e.key === "KeyD") keys['d'] = true;
      });

      window.addEventListener('keyup', (e) => {
          if (e.key in keys) keys[e.key] = false;
          if (e.key === "KeyW") keys['w'] = false;
          if (e.key === "KeyA") keys['a'] = false;
          if (e.key === "KeyS") keys['s'] = false;
          if (e.key === "KeyD") keys['d'] = false;
      });

      function updateKeyboardInput() {
          moveVector.x = 0;
          moveVector.y = 0;

          if (keys['a'] || keys['ArrowLeft']) moveVector.x = -0.05;
          if (keys['d'] || keys['ArrowRight']) moveVector.x = 0.05;
          if (keys['w'] || keys['ArrowUp']) moveVector.y = 0.05;
          if (keys['s'] || keys['ArrowDown']) moveVector.y = -0.05;

          isShooting = keys[" "];
      }
      window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // --- 7. RUNTIME ACTION LOOP ---
      let bullets = [];
      let particles = [];
      let enemyProjectiles = [];

      function animate() {
          requestAnimationFrame(animate);

          // Read latest hardware keystrokes
          updateKeyboardInput();

          // Apply physics movement rotations to jet mechanics
          jetGroup.rotation.z = -moveVector.x * 12; 
          jetGroup.rotation.x = moveVector.y * 5;
          jetGroup.position.x += moveVector.x * 6;
          jetGroup.position.y += moveVector.y * 6;
          jetGroup.position.z -= 0.3; // Forward velocity engine crawl
          if(jetGroup.position.y < 1) jetGroup.position.y = 1; // Floor boundary safety check

          // Animate pulsing engine afterburners
          const pulse = 1 + Math.sin(Date.now() * 0.05) * 0.15;
          leftTrail.scale.set(pulse, pulse, 1);
          rightTrail.scale.set(pulse, pulse, 1);

          // Track camera dynamically behind flight vectors
          camera.position.set(jetGroup.position.x, jetGroup.position.y + 1.8, jetGroup.position.z + 7);
          camera.lookAt(jetGroup.position.x, jetGroup.position.y, jetGroup.position.z - 15);

          // Target Lock UI calculation mechanics
          const crosshairElement = document.getElementById('crosshair');
          let enemyScreenPos = enemy.position.clone().project(camera);
          let distFromCenter = Math.sqrt(enemyScreenPos.x*enemyScreenPos.x + enemyScreenPos.y*enemyScreenPos.y);
          if (distFromCenter < 0.15 && enemy.position.z < jetGroup.position.z) {
              crosshairElement.style.borderColor = '#ff0000'; // Lock acquired color update
          } else {
              crosshairElement.style.borderColor = '#00ff00';
          }

          // Handle environmental power-up ring interaction checks
          rings.forEach(ring => {
              if(jetGroup.position.distanceTo(ring.position) < 4) {
                  score += 50;
                  document.getElementById('score-val').innerText = score;
                  ring.position.z -= 400; // Relocate rings infinitely forward
                  ring.position.x = (Math.random()-0.5)*150;
              }
              if(ring.position.z > jetGroup.position.z + 20) { ring.position.z -= 400; }
          });

          // Move and animate target drone vectors
          enemy.position.z -= 0.1;
          enemy.position.x += Math.sin(Date.now() * 0.001) * 0.15;
          enemy.position.y += Math.cos(Date.now() * 0.0015) * 0.05;
          enemy.rotation.y += 0.02;

          if (enemy.position.z > jetGroup.position.z + 10) { resetEnemyPosition(); }

          // Enemy offense shooting logic sequence
          if (Math.random() < 0.015 && enemy.position.z < jetGroup.position.z) {
              const pGeo = new THREE.SphereGeometry(0.3, 4, 4);
              const pMat = new THREE.MeshBasicMaterial({ color: 0xff5500 });
              const proj = new THREE.Mesh(pGeo, pMat);
              proj.position.copy(enemy.position);
              
              // Direct vector calculation toward current jet body positions
              proj.velocity = new THREE.Vector3().subVectors(jetGroup.position, enemy.position).normalize().multiplyScalar(0.8);
              scene.add(proj);
              enemyProjectiles.push(proj);
          }

          // Update tactical enemy bullet trajectories
          for(let i = enemyProjectiles.length - 1; i >= 0; i--) {
              enemyProjectiles[i].position.add(enemyProjectiles[i].velocity);
              if(enemyProjectiles[i].position.distanceTo(jetGroup.position) < 1.5) {
                  playerHealth -= 15;
                  document.getElementById('health-fill').style.width = `${Math.max(0, playerHealth)}%`;
                  scene.remove(enemyProjectiles[i]);
                  enemyProjectiles.splice(i, 1);
                  if(playerHealth <= 0) { alert(`MISSION FAILED! Score: ${score}`); resetGame(); }
                  continue;
              }
              if(enemyProjectiles[i].position.distanceTo(jetGroup.position) > 200) {
                  scene.remove(enemyProjectiles[i]);
                  enemyProjectiles.splice(i,1);
              }
          }

          // Laser safety weapon thermodynamics systems tracking
          if (isShooting && !isOverheated) {
              weaponHeat += 2.5;
              if (weaponHeat >= 100) { isOverheated = true; }
              
              if(Math.random() < 0.25) {
                  const laserGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2);
                  laserGeo.rotateX(Math.PI / 2);
                  const laserMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa });
                  const laser = new THREE.Mesh(laserGeo, laserMat);
                  laser.position.copy(jetGroup.position);
                  bullets.push(laser);
                  scene.add(laser);
              }
          } else {
              weaponHeat -= 1.2;
              if (weaponHeat <= 0) { weaponHeat = 0; isOverheated = false; }
          }
          document.getElementById('heat-fill').style.width = `${weaponHeat}%`;
          document.getElementById('heat-fill').style.background = isOverheated ? '#ff0000' : '#ffff00';

          // Process friendly projectile trajectory tracking runs
          for (let i = bullets.length - 1; i >= 0; i--) {
              bullets[i].position.z -= 1.5;
              let dist = bullets[i].position.distanceTo(enemy.position);
              
              if (dist < 2.2) {
                  createExplosion(enemy.position);
                  score += 100;
                  document.getElementById('score-val').innerText = score;
                  if(score > hiScore) { hiScore = score; localStorage.setItem('dogfight_hiscore', hiScore); document.getElementById('hiscore-val').innerText = hiScore; }
                  
                  resetEnemyPosition();
                  scene.remove(bullets[i]);
                  bullets.splice(i, 1);
                  continue;
              }
              if (bullets[i].position.z < jetGroup.position.z - 150) {
                  scene.remove(bullets[i]);
                  bullets.splice(i, 1);
              }
          }

          // Update expansion vectors on structural particle engines
          for (let i = particles.length - 1; i >= 0; i--) {
              particles[i].position.add(particles[i].userData.velocity);
              particles[i].material.opacity -= 0.02;
              if(particles[i].material.opacity <= 0) {
                  scene.remove(particles[i]);
                  particles.splice(i, 1);
              }
          }

          renderer.render(scene, camera);
      }

      // Helper mechanics for exploding mesh items into tiny parts
      function createExplosion(pos) {
          const partGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
          for(let i=0; i<15; i++) {
              const partMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 1 });
              const p = new THREE.Mesh(partGeo, partMat);
              p.position.copy(pos);
              p.userData.velocity = new THREE.Vector3((Math.random()-0.5)*0.4, (Math.random()-0.5)*0.4, (Math.random()-0.5)*0.4);
              scene.add(p);
              particles.push(p);
          }
      }

      function resetEnemyPosition() {
          enemy.position.set((Math.random() - 0.5) * 35, jetGroup.position.y + (Math.random()-0.3)*10, jetGroup.position.z - 80);
      }

      function resetGame() {
          score = 0; document.getElementById('score-val').innerText = score;
          playerHealth = 100; document.getElementById('health-fill').style.width = '100%';
          weaponHeat = 0; isOverheated = false;
          jetGroup.position.set(0, 8, 0);
          enemyProjectiles.forEach(p => scene.remove(p)); enemyProjectiles = [];
          bullets.forEach(b => scene.remove(b)); bullets = [];
          resetEnemyPosition();
      }

      animate();
    </script>
  </body>
</html>
