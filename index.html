<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dogfight Jet Game</title>
    <!-- Loads the unblocked 3D graphics engine -->
    <script src="https://cloudflare.com"></script>
    <style>
      body { margin: 0; overflow: hidden; background-color: #87ceeb; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <script>
      // --- 1. SETUP THE 3D WORLD ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(10, 20, 15);
      scene.add(directionalLight);

      // --- 2. CREATE THE PLAYER JET ---
      const jetGroup = new THREE.Group();
      const bodyGeo = new THREE.ConeGeometry(0.5, 3, 8);
      bodyGeo.rotateX(Math.PI / 2);
      const jetMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const jetBody = new THREE.Mesh(bodyGeo, jetMaterial);
      jetGroup.add(jetBody);

      const wingGeo = new THREE.BoxGeometry(4, 0.1, 1);
      const wing = new THREE.Mesh(wingGeo, jetMaterial);
      jetGroup.add(wing);

      scene.add(jetGroup);
      jetGroup.position.set(0, 5, 0);

      // --- 3. CREATE THE ENEMY DRONE ---
      const enemyGeo = new THREE.SphereGeometry(1, 8, 8);
      const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, wireframe: true });
      const enemy = new THREE.Mesh(enemyGeo, enemyMat);
      scene.add(enemy);
      enemy.position.set(0, 5, -30);

      // --- 4. CREATE SIMPLE TERRAIN ---
      const floorGeo = new THREE.PlaneGeometry(1000, 1000, 20, 20);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x228b22, wireframe: true });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // --- 5. TOUCH CONTROLS ---
      let touchStart = { x: 0, y: 0 };
      let moveVector = { x: 0, y: 0 };
      let isShooting = false;

      window.addEventListener('touchstart', (e) => {
          touchStart.x = e.touches[0].clientX;
          touchStart.y = e.touches[0].clientY;
          isShooting = true;
      });

      window.addEventListener('touchmove', (e) => {
          moveVector.x = (e.touches[0].clientX - touchStart.x) * 0.005;
          moveVector.y = (touchStart.y - e.touches[0].clientY) * 0.005; 
      });

      window.addEventListener('touchend', () => {
          moveVector = { x: 0, y: 0 };
          isShooting = false;
      });

      // --- 6. GAME LOOP ---
      let bullets = [];

      function animate() {
          requestAnimationFrame(animate);

          jetGroup.rotation.z = -moveVector.x * 10;
          jetGroup.position.x += moveVector.x * 5;
          jetGroup.position.y += moveVector.y * 5;
          jetGroup.position.z -= 0.2;

          camera.position.set(jetGroup.position.x, jetGroup.position.y + 2, jetGroup.position.z + 8);
          camera.lookAt(jetGroup.position.x, jetGroup.position.y, jetGroup.position.z - 10);

          enemy.position.z -= 0.15;
          enemy.position.x += Math.sin(Date.now() * 0.002) * 0.1;

          if (isShooting && Math.random() < 0.15) {
              const laserGeo = new THREE.CylinderGeometry(0.05, 0.05, 1);
              laserGeo.rotateX(Math.PI / 2);
              const laserMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
              const laser = new THREE.Mesh(laserGeo, laserMat);
              
              laser.position.copy(jetGroup.position);
              bullets.push(laser);
              scene.add(laser);
          }

          for (let i = bullets.length - 1; i >= 0; i--) {
              bullets[i].position.z -= 1;
              let dist = bullets[i].position.distanceTo(enemy.position);
              if (dist < 2) {
                  enemy.position.set((Math.random() - 0.5) * 20, 5, jetGroup.position.z - 50);
                  scene.remove(bullets[i]);
                  bullets.splice(i, 1);
                  continue;
              }
              if (bullets[i].position.z < jetGroup.position.z - 100) {
                  scene.remove(bullets[i]);
                  bullets.splice(i, 1);
              }
          }
          renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    </script>
  </body>
</html>
