<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Third-Person Flight Simulator</title>
    <!-- Loads the 3D Graphics Engine -->
    <script src="https://cloudflare.com"></script>
    <style>
      body { margin: 0; overflow: hidden; background-color: #87ceeb; font-family: monospace; user-select: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      
      /* Pilot Dashboard HUD */
      #hud { position: absolute; top: 15px; left: 15px; color: #00ff44; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; }
      #bars { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; width: 180px; pointer-events: none; }
      .bar-container { background: rgba(0,0,0,0.6); border: 2px solid #00ff44; height: 14px; position: relative; border-radius: 4px; overflow: hidden; }
      .bar-fill { height: 100%; width: 100%; background: #00ff44; }
      #health-fill { background: #ff2222; }
      #heat-fill { background: #ffaa00; width: 0%; }
      .bar-label { position: absolute; font-size: 9px; color: #fff; top: 0px; left: 6px; font-weight: bold; text-shadow: 1px 1px #000; }
      
      /* Targeting Reticle */
      #reticle { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; border: 2px solid #00ff44; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
      #reticle-dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #00ff44; border-radius: 50%; transform: translate(-50%, -50%); }
      
      #controls-guide { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 20px; text-align: center; font-size: 12px; pointer-events: none; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="hud">THROTTLE: AUTO (180 KTS)<br>SCORE: <span id="score-val">0</span><br>DRONES DOWN: <span id="kill-val">0</span></div>
    <div id="bars">
      <div class="bar-container"><div id="health-fill" class="bar-fill"></div><div class="bar-label">FIGHTER HULL</div></div>
      <div class="bar-container"><div id="heat-fill" class="bar-fill"></div><div class="bar-label">CANNON HEAT</div></div>
    </div>
    <div id="reticle"><div id="reticle-dot"></div></div>
    <div id="controls-guide">STEER FLIGHT: [W,A,S,D] or [ARROWS] &nbsp;&nbsp;|&nbsp;&nbsp; FIRE CANNON: [SPACEBAR]</div>

    <script>
      // --- 1. CORE ENGINE SCENE INITIALIZATION ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb); // Bright daylight blue sky
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
      sunLight.position.set(100, 300, 50);
      scene.add(sunLight);

      let score = 0, kills = 0;
      let playerHealth = 100, weaponHeat = 0, isOverheated = false;
      // --- 2. CREATE 3RD-PERSON JET MODEL ---
      const jetGroup = new THREE.Group();
      const jetMat = new THREE.MeshStandardMaterial({ color: 0x556677, metalness: 0.8, roughness: 0.2 }); // Dark metallic grey armor

      // Fuselage / Jet Cockpit Main Body
      const bodyGeo = new THREE.CylinderGeometry(0.3, 0.4, 2.8, 8);
      bodyGeo.rotateX(Math.PI / 2);
      const mainBody = new THREE.Mesh(bodyGeo, jetMat);
      jetGroup.add(mainBody);

      // Large Delta Flight Wings
      const wingGeo = new THREE.BoxGeometry(4.0, 0.05, 1.2);
      const wings = new THREE.Mesh(wingGeo, jetMat);
      wings.position.set(0, -0.05, -0.2);
      jetGroup.add(wings);

      // Vertical Tail Fin Stabilizer
      const tailGeo = new THREE.BoxGeometry(0.05, 0.8, 0.6);
      const tail = new THREE.Mesh(tailGeo, jetMat);
      tail.position.set(0, 0.4, 1.1);
      jetGroup.add(tail);

      // Glowing Orange Engine Thrust Flame
      const flameMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
      const thruster = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.02, 0.5, 8), flameMat);
      thruster.rotateX(Math.PI / 2);
      thruster.position.set(0, 0, 1.4);
      jetGroup.add(thruster);

      scene.add(jetGroup);
      jetGroup.position.set(0, 35, 0); // Spawns the jet high in the air

      // 🎥 INSTANT CAMERA RE-FIX: Prevents the camera from spawning on the ground
      camera.position.set(jetGroup.position.x, jetGroup.position.y + 1.8, jetGroup.position.z + 7.5);

      // --- 3. SCENERY MAP: GREEN FLOOR & SKY CLOUDS ---
      const groundGeo = new THREE.PlaneGeometry(6000, 6000, 40, 40);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x447733, wireframe: true });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -10; // Placed deep below the flight paths
      scene.add(ground);

      // Generate Puffy Cloud Scenery Box Models
      const clouds = [];
      const cloudGeo = new THREE.SphereGeometry(5, 6, 6);
      const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
      for(let i=0; i<30; i++) {
          const cloudCluster = new THREE.Group();
          for(let j=0; j<3; j++) {
              const cloudPart = new THREE.Mesh(cloudGeo, cloudMat);
              cloudPart.position.set((Math.random()-0.5)*8, (Math.random()-0.5)*3, (Math.random()-0.5)*8);
              cloudCluster.add(cloudPart);
          }
          cloudCluster.position.set((Math.random()-0.5)*350, Math.random()*50 + 15, -Math.random()*600 - 50);
          scene.add(cloudCluster);
          clouds.push(cloudCluster);
      }

      // --- 4. RED ENEMY DRONE SQUADRONS ---
      const enemies = [];
      const droneGeo = new THREE.ConeGeometry(0.4, 2.2, 5);
      droneGeo.rotateX(-Math.PI / 2); // Face forward down the tracks
      const droneMat = new THREE.MeshStandardMaterial({ color: 0xff0044, metalness: 0.5 }); // Bright red enemy target

      for(let i=0; i<4; i++) {
          const drone = new THREE.Mesh(droneGeo, droneMat);
          resetObjectMatrix(drone, -120 - (i * 60));
          drone.userData = { speed: 0.2 + Math.random()*0.3, weave: Math.random()*5 };
          scene.add(drone);
          enemies.push(drone);
      }

      // --- 5. KEYBOARD MOVEMENT MATRIX LISTENERS ---
      const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, " ": false };
      let moveVector = { x: 0, y: 0 }, isShooting = false;

      window.addEventListener('keydown', (e) => {
          if (e.key in keys) keys[e.key] = true;
          if (e.code === "KeyW") keys['w'] = true; if (e.code === "KeyA") keys['a'] = true;
          if (e.code === "KeyS") keys['s'] = true; if (e.code === "KeyD") keys['d'] = true;
          if (e.code === "Space") keys[" "] = true;
      });
      window.addEventListener('keyup', (e) => {
          if (e.key in keys) keys[e.key] = false;
          if (e.code === "KeyW") keys['w'] = false; if (e.code === "KeyA") keys['a'] = false;
          if (e.code === "KeyS") keys['s'] = false; if (e.code === "KeyD") keys['d'] = false;
          if (e.code === "Space") keys[" "] = false;
      });

      function readControlsInput() {
          moveVector.x = 0; moveVector.y = 0;
          if (keys['a'] || keys['ArrowLeft']) moveVector.x = -0.055;
          if (keys['d'] || keys['ArrowRight']) moveVector.x = 0.055;
          if (keys['w'] || keys['ArrowUp']) moveVector.y = 0.045;
          if (keys['s'] || keys['ArrowDown']) moveVector.y = -0.045;
          isShooting = keys[" "];
      }

      function resetObjectMatrix(obj, offsetZ) {
          obj.position.set((Math.random() - 0.5) * 120, Math.random() * 55 + 10, offsetZ);
      }
      window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // --- 6. FLIGHT RUNTIME SIMULATION MAIN ENGINE LOOP ---
      let playerBullets = [];
      let enemyBullets = [];
      let forwardFlightVelocity = 1.3; // Automatic cruise speed running into the map loops

      function animate() {
          requestAnimationFrame(animate);
          readControlsInput();

          // Apply physics banking and barrel rolling to plane graphics rotation
          jetGroup.rotation.z = THREE.MathUtils.lerp(jetGroup.rotation.z, -moveVector.x * 12, 0.1); 
          jetGroup.rotation.x = THREE.MathUtils.lerp(jetGroup.rotation.x, moveVector.y * 4, 0.1);
          jetGroup.rotation.y = moveVector.x * -0.3; // Bank turning yaw vectors

          // Translate fighter position map coordinates forward
          jetGroup.position.x += moveVector.x * 7.5;
          jetGroup.position.y += moveVector.y * 7.5;
          jetGroup.position.z -= forwardFlightVelocity; // Continuous forward propulsion progression

          // Ceiling and floor security bounds safeguards
          if(jetGroup.position.y < 2) jetGroup.position.y = 2;
          if(jetGroup.position.y > 85) jetGroup.position.y = 85;

          // Pulse thruster flame glow dimensions
          thruster.scale.set(1, 1 + Math.sin(Date.now() * 0.1) * 0.2, 1);

          // 🎥 TRUE THIRD-PERSON MOUNT: Instantly matches camera right behind the jet tail wing
          camera.position.x = THREE.MathUtils.lerp(camera.position.x, jetGroup.position.x, 0.08);
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, jetGroup.position.y + 1.8, 0.08);
          camera.position.z = jetGroup.position.z + 7.5; // Fixed camera space offset units back
          camera.lookAt(jetGroup.position.x, jetGroup.position.y + 0.3, jetGroup.position.z - 25);

          // Cycle cloud models endlessly ahead to keep flight visual loop illusion active
          clouds.forEach(cloud => {
              if (cloud.position.z > jetGroup.position.z + 25) {
                  cloud.position.z -= 600;
                  cloud.position.x = (Math.random() - 0.5) * 400;
                  cloud.position.y = Math.random() * 55 + 15;
              }
          });

          // Run Rogue Drone Tracking and Offense Actions Loops
          enemies.forEach(drone => {
              drone.position.z -= drone.userData.speed * 0.45; // Drift forward relative to airspace speeds
              drone.position.x += Math.sin(Date.now() * 0.0025 + drone.userData.weave) * 0.15; // Weave left and right

              if (drone.position.z > jetGroup.position.z + 20) { resetObjectMatrix(drone, jetGroup.position.z - 220); }

              // Drone offense shooting procedures trigger tracking runs
              if (Math.random() < 0.015 && drone.position.z < jetGroup.position.z && drone.position.distanceTo(jetGroup.position) < 220) {
                  const eBolt = new THREE.Mesh(new THREE.SphereGeometry(0.35, 4, 4), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
                  eBolt.position.copy(drone.position);
                  eBolt.userData = { dir: new THREE.Vector3().subVectors(jetGroup.position, drone.position).normalize().multiplyScalar(1.4) };
                  scene.add(eBolt);
                  enemyBullets.push(eBolt);
              }
          });

          // Process enemy incoming plasma damage fields updates
          for(let i = enemyBullets.length - 1; i >= 0; i--) {
              enemyBullets[i].position.add(enemyBullets[i].userData.dir);
              if (enemyBullets[i].position.distanceTo(jetGroup.position) < 1.8) {
                  playerHealth -= 10;
                  document.getElementById('health-fill').style.width = `${Math.max(0, playerHealth)}%`;
                  scene.remove(enemyBullets[i]);
                  enemyBullets.splice(i, 1);
                  if (playerHealth <= 0) { alert(`MAYDAY! Starfighter Shot Down!\nFinal Score: ${score}\nKills Secured: ${kills}`); resetFlightField(); }
                  continue;
              }
              if (enemyBullets[i].position.distanceTo(jetGroup.position) > 300) {
                  scene.remove(enemyBullets[i]);
                  enemyBullets.splice(i, 1);
              }
          }

          // Autocannon heat accumulation metrics loops variables
          if (isShooting && !isOverheated) {
              weaponHeat += 3.8;
              if (weaponHeat >= 100) isOverheated = true;

              if(Math.random() < 0.35) { // Rapid automatic fire streams
                  const tracer = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.6), new THREE.MeshBasicMaterial({ color: 0x00ff44 }));
                  tracer.rotateX(Math.PI / 2);
                  tracer.position.copy(jetGroup.position);
                  scene.add(tracer);
                  playerBullets.push(tracer);
              }
          } else {
              weaponHeat -= 2.2;
              if (weaponHeat <= 0) { weaponHeat = 0; isOverheated = false; }
          }
          document.getElementById('heat-fill').style.width = `${weaponHeat}%`;
          document.getElementById('heat-fill').style.background = isOverheated ? '#ff2222' : '#ffaa00';

          // Friendly projectile update track operations loops runs
          for(let i = playerBullets.length - 1; i >= 0; i--) {
              playerBullets[i].position.z -= 3.0; // Fly forward fast straight ahead

              let hitDetected = false;
              for(let j = 0; j < enemies.length; j++) {
                  if (playerBullets[i].position.distanceTo(enemies[j].position) < 3.2) {
                      kills++; score += 500;
                      document.getElementById('score-val').innerText = score;
                      document.getElementById('kill-val').innerText = kills;

                      resetObjectMatrix(enemies[j], jetGroup.position.z - 240);
                      scene.remove(playerBullets[i]);
                      playerBullets.splice(i, 1);
                      hitDetected = true;
                      break;
                  }
              }

              if (hitDetected) continue;
              if (playerBullets[i].position.z < jetGroup.position.z - 250) {
                  scene.remove(playerBullets[i]);
                  playerProjectiles = playerBullets.splice(i, 1);
              }
          }

          score++;
          document.getElementById('score-val').innerText = score;

          renderer.render(scene, camera);
      }

      function resetFlightField() {
          score = 0; kills = 0; playerHealth = 100; weaponHeat = 0; isOverheated = false;
          document.getElementById('score-val').innerText = score;
          document.getElementById('kill-val').innerText = kills;
          document.getElementById('health-fill').style.width = '100%';
          jetGroup.position.set(0, 35, 0);
          camera.position.set(jetGroup.position.x, jetGroup.position.y + 1.8, jetGroup.position.z + 7.5);

          enemyBullets.forEach(p => scene.remove(p)); enemyBullets = [];
          playerBullets.forEach(b => scene.remove(b)); playerBullets = [];
          enemies.forEach((drone, idx) => resetObjectMatrix(drone, -100 - (idx * 60)));
          clouds.forEach((cloud) => cloud.position.set((Math.random()-0.5)*350, Math.random()*50 + 15, -Math.random()*600 - 50));
      }

      animate();
    </script>
  </body>
</html>
