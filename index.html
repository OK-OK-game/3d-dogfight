<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Third-Person Flight Simulator</title>
    <!-- Loads the 3D Engine directly via unblocked web script import modules -->
    <script src="https://cloudflare.com"></script>
    <style>
      body { margin: 0; overflow: hidden; background-color: #87ceeb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      
      /* Arcade Fighter Pilot HUD */
      #hud { position: absolute; top: 15px; left: 15px; color: #00ff44; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 3px #000; pointer-events: none; font-family: monospace; }
      #bars { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; width: 180px; pointer-events: none; font-family: monospace; }
      .bar-container { background: rgba(0,0,0,0.5); border: 2px solid #00ff44; height: 14px; position: relative; border-radius: 4px; overflow: hidden; }
      .bar-fill { height: 100%; width: 100%; transition: width 0.1s; background: #00ff44; }
      #health-fill { background: #ff2222; }
      #heat-fill { background: #ffaa00; width: 0%; }
      .bar-label { position: absolute; font-size: 9px; color: #fff; top: 0px; left: 6px; font-weight: bold; text-shadow: 1px 1px #000; }
      
      /* Jet Locking Crosshairs reticle */
      #reticle { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; border: 2px solid #00ff44; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
      #reticle-dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #00ff44; border-radius: 50%; transform: translate(-50%, -50%); }
      
      #controls-guide { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; text-align: center; font-size: 12px; pointer-events: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
  </head>
  <body>
    <div id="hud">AIRSPEED: 180 KTS<br>SCORE: <span id="score-val">0</span><br>DRONES DOWN: <span id="kill-val">0</span></div>
    <div id="bars">
      <div class="bar-container"><div id="health-fill" class="bar-fill"></div><div class="bar-label">PLANE HULL INTEGRITY</div></div>
      <div class="bar-container"><div id="heat-fill" class="bar-fill"></div><div class="bar-label">AUTOCANNON OVERHEAT</div></div>
    </div>
    <div id="reticle"><div id="reticle-dot"></div></div>
    <div id="controls-guide">STEER FLIGHT: [W,A,S,D] or [ARROWS] &nbsp;&nbsp;|&nbsp;&nbsp; AUTOCANNON FIRE: [SPACEBAR]</div>

    <script>
      // --- 1. CORE GRAPHICS ENGINE SETUP ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xaaccff); // Light blue sky dome atmosphere
      scene.fog = new THREE.FogExp2(0xaaccff, 0.005);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Bright sunlight rig
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
      sunLight.position.set(100, 300, 50);
      scene.add(sunLight);

      // --- 2. GAME PARAMETERS ENGINE ---
      let score = 0, kills = 0;
      let playerHealth = 100, weaponHeat = 0, isOverheated = false;
      // --- 3. CREATE 3RD-PERSON PLAYER PLANE MESHS ---
      const jetGroup = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.7, roughness: 0.2 }); // Light gray aircraft aluminum
      const detailMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });

      // Fuselage central cabin cone structure
      const fuselage = new THREE.Mesh(new THREE.ConeGeometry(0.4, 3, 8), bodyMat);
      fuselage.rotateX(Math.PI / 2);
      jetGroup.add(fuselage);

      // Main structural delta wings
      const wings = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.06, 1), bodyMat);
      wings.position.set(0, -0.05, -0.2);
      jetGroup.add(wings);

      // Tail wing elevator rudder flap
      const tailFin = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.8, 0.5), bodyMat);
      tailFin.position.set(0, 0.4, 1.2);
      jetGroup.add(tailFin);

      // Afterburner neon combustion ring systems
      const flameMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.8 });
      const jetThruster = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.02, 0.6, 8), flameMat);
      jetThruster.rotateX(Math.PI/2);
      jetThruster.position.set(0, 0, 1.5);
      jetGroup.add(jetThruster);

      scene.add(jetGroup);
      jetGroup.position.set(0, 40, 0); // Start flying high up in the air workspace

      // --- 4. WORLD MAP SCENERY: GROUND GRID & VOLUMETRIC CLOUDS ---
      // Infinite rolling terrain grid floor
      const groundGeo = new THREE.PlaneGeometry(5000, 5000, 50, 50);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x558844, roughness: 0.9, wireframe: true }); // Green country side terrain mesh grid
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -20; // Positioned far down beneath flight patterns
      scene.add(ground);

      // Procedural Volumetric puffy 3D cloud clusters
      const clouds = [];
      const cloudGeo = new THREE.SphereGeometry(6, 7, 7);
      const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
      
      for(let i=0; i<35; i++) {
          const cloudCluster = new THREE.Group();
          // Merge spheres together to build unique puffy cloud bundles
          for(let j=0; j<4; j++) {
              const cloudPart = new THREE.Mesh(cloudGeo, cloudMat);
              cloudPart.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*4, (Math.random()-0.5)*10);
              cloudCluster.add(cloudPart);
          }
          cloudCluster.position.set((Math.random() - 0.5) * 400, Math.random() * 60 + 15, -Math.random() * 600 - 50);
          scene.add(cloudCluster);
          clouds.push(cloudCluster);
      }

      // --- 5. SWARM ROGUE AI ENEMY FIGHTER JETS ---
      const enemies = [];
      const enemyGeo = new THREE.ConeGeometry(0.5, 2.5, 6);
      enemyGeo.rotateX(-Math.PI / 2); // Point them forward down coordinate tracks
      const enemyMat = new THREE.MeshStandardMaterial({ color: 0xd90429, metalness: 0.6, roughness: 0.3 }); // Crimson red hostile fighter paint

      for(let i=0; i<4; i++) {
          const droneJet = new THREE.Mesh(enemyGeo, enemyMat);
          resetObjectMatrix(droneJet, -100 - (i * 60));
          droneJet.userData = { speed: 0.25 + Math.random()*0.3, weaveOffset: Math.random()*10 };
          scene.add(droneJet);
          enemies.push(droneJet);
      }

      // --- 6. CONTINUOUS VELOCITY INPUT REGISTRATION HOOKS ---
      const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, " ": false };
      let moveVector = { x: 0, y: 0 };
      let isShooting = false;

      window.addEventListener('keydown', (e) => {
          if (e.key in keys) keys[e.key] = true;
          if (e.code === "KeyW") keys['w'] = true;
          if (e.code === "KeyA") keys['a'] = true;
          if (e.code === "KeyS") keys['s'] = true;
          if (e.code === "KeyD") keys['d'] = true;
          if (e.code === "Space") keys[" "] = true;
      });

      window.addEventListener('keyup', (e) => {
          if (e.key in keys) keys[e.key] = false;
          if (e.code === "KeyW") keys['w'] = false;
          if (e.code === "KeyA") keys['a'] = false;
          if (e.code === "KeyS") keys['s'] = false;
          if (e.code === "KeyD") keys['d'] = false;
          if (e.code === "Space") keys[" "] = false;
      });

      function processFlightInput() {
          moveVector.x = 0; moveVector.y = 0;
          if (keys['a'] || keys['ArrowLeft']) moveVector.x = -0.06;
          if (keys['d'] || keys['ArrowRight']) moveVector.x = 0.06;
          if (keys['w'] || keys['ArrowUp']) moveVector.y = 0.05;
          if (keys['s'] || keys['ArrowDown']) moveVector.y = -0.05;
          isShooting = keys[" "];
      }

      function resetObjectMatrix(obj, offsetZ) {
          obj.position.set((Math.random() - 0.5) * 110, Math.random() * 60 + 10, offsetZ);
      }
      window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // --- 7. RUNTIME 3RD-PERSON ACTION SIMULATOR ENGINE LOOP ---
      let friendlyLasers = [];
      let enemyLasers = [];
      let cloudSpeed = 1.35; // Forward baseline jet propulsion translation rate

      function animate() {
          requestAnimationFrame(animate);
          processFlightInput();

          // Smooth aircraft roll, banking, and pitch simulation calculations
          jetGroup.rotation.z = THREE.MathUtils.lerp(jetGroup.rotation.z, -moveVector.x * 12, 0.1); 
          jetGroup.rotation.x = THREE.MathUtils.lerp(jetGroup.rotation.x, moveVector.y * 4, 0.1);
          jetGroup.rotation.y = moveVector.x * -0.3; // Slight banking yaw turn axis

          // Apply coordinates adjustments over workspace positions fields
          jetGroup.position.x += moveVector.x * 7;
          jetGroup.position.y += moveVector.y * 7;
          jetGroup.position.z -= cloudSpeed; // Unending auto-propulsion flight vectors crawling

          // Strict altitude height check boundary limits safeguards
          if(jetGroup.position.y < 3) jetGroup.position.y = 3;
          if(jetGroup.position.y > 90) jetGroup.position.y = 90;

          // Engine afterburner expansion scaling pulse effect
          jetThruster.scale.set(1, 1 + Math.sin(Date.now() * 0.1) * 0.25, 1);

          // 🎥 CRITICAL CRITERIA: MOUNT THIRD-PERSON CAM FLIGHT MOUNT RIGHT BEHIND TAIL WING RIG
          camera.position.x = THREE.MathUtils.lerp(camera.position.x, jetGroup.position.x, 0.08);
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, jetGroup.position.y + 1.8, 0.08);
          camera.position.z = jetGroup.position.z + 6.8; // Positioned behind the jet looking down forward engine trajectories
          camera.lookAt(jetGroup.position.x, jetGroup.position.y + 0.3, jetGroup.position.z - 25);

          // Cycle clouds infinitely forward to maintain speed illusion loops
          clouds.forEach(cloud => {
              if (cloud.position.z > jetGroup.position.z + 20) {
                  cloud.position.z -= 600;
                  cloud.position.x = (Math.random() - 0.5) * 400;
                  cloud.position.y = Math.random() * 60 + 15;
              }
          });

          // Run Hostile Jet Tracking AI behaviors loop passes
          enemies.forEach(drone => {
              drone.position.z -= drone.userData.speed * 0.4; // Fly slightly slower forward into combat tracking routes
              // Perform gentle evasive flight weaving pattern paths
              drone.position.x += Math.sin(Date.now() * 0.002 + drone.userData.weaveOffset) * 0.15;
              drone.rotation.z = Math.sin(Date.now() * 0.002) * 0.4;

              // Reposition drone forward when overtaken
              if (drone.position.z > jetGroup.position.z + 15) { resetObjectMatrix(drone, jetGroup.position.z - 200); }

              // Hostile cannon fire system routines tracking fields
              if (Math.random() < 0.015 && drone.position.z < jetGroup.position.z && drone.position.distanceTo(jetGroup.position) < 200) {
                  const eBolt = new THREE.Mesh(new THREE.SphereGeometry(0.3, 4, 4), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
                  eBolt.position.copy(drone.position);
                  eBolt.userData = { dir: new THREE.Vector3().subVectors(jetGroup.position, drone.position).normalize().multiplyScalar(1.3) };
                  scene.add(eBolt);
                  enemyLasers.push(eBolt);
              }
          });

          // Update tactical enemy damage tracking fields
          for(let i = enemyLasers.length - 1; i >= 0; i--) {
              enemyLasers[i].position.add(enemyLasers[i].userData.dir);
              if (enemyLasers[i].position.distanceTo(jetGroup.position) < 1.6) {
                  playerHealth -= 10;
                  document.getElementById('health-fill').style.width = `${Math.max(0, playerHealth)}%`;
                  scene.remove(enemyLasers[i]);
                  enemyLasers.splice(i, 1);
                  if (playerHealth <= 0) { alert(`MAYDAY! PLANE SHOT DOWN!\nScore: ${score}\nTargets Eliminated: ${kills}`); resetFlightSimulator(); }
                  continue;
              }
              if (enemyLasers[i].position.distanceTo(jetGroup.position) > 250) {
                  scene.remove(enemyLasers[i]);
                  enemyLasers.splice(i, 1);
              }
          }

          // Player autocannon heating and ventilation thermodynamics tracking runs
          if (isShooting && !isOverheated) {
              weaponHeat += 4;
              if (weaponHeat >= 100) isOverheated = true;

              if(Math.random() < 0.3) { // High velocity rate of fire tracer lines
                  const projectile = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.5), new THREE.MeshBasicMaterial({ color: 0x00ff44 }));
                  projectile.rotateX(Math.PI / 2);
                  projectile.position.copy(jetGroup.position);
                  scene.add(projectile);
                  friendlyLasers.push(projectile);
              }
          } else {
              weaponHeat -= 2;
              if (weaponHeat <= 0) { weaponHeat = 0; isOverheated = false; }
          }
          document.getElementById('heat-fill').style.width = `${weaponHeat}%`;
          document.getElementById('heat-fill').style.background = isOverheated ? '#ff2222' : '#ffaa00';

          // Friendly projectile trajectory track sweeps and collision scans loops runs
          for(let i = friendlyLasers.length - 1; i >= 0; i--) {
              friendlyLasers[i].position.z -= 2.8; // Fire tracers rapidly outward ahead values

              let tracerRemoved = false;
              for(let j = 0; j < enemies.length; j++) {
                  if (friendlyLasers[i].position.distanceTo(enemies[j].position) < 3.0) {
                      kills++; score += 500;
                      document.getElementById('score-val').innerText = score;
                      document.getElementById('kill-val').innerText = kills;

                      resetObjectMatrix(enemies[j], jetGroup.position.z - 250);
                      scene.remove(friendlyLasers[i]);
                      friendlyLasers.splice(i, 1);
                      tracerRemoved = true;
                      break;
                  }
              }

              if (tracerRemoved) continue;
              if (friendlyLasers[i].position.z < jetGroup.position.z - 250) {
                  scene.remove(friendlyLasers[i]);
                  friendlyLasers.splice(i, 1);
              }
          }

          // Passive runtime survival score progression adder updates
          score++;
          document.getElementById('score-val').innerText = score;

          renderer.render(scene, camera);
      }

      function resetFlightSimulator() {
          score = 0; kills = 0; playerHealth = 100; weaponHeat = 0; isOverheated = false;
          document.getElementById('score-val').innerText = score;
          document.getElementById('kill-val').innerText = kills;
          document.getElementById('health-fill').style.width = '100%';
          jetGroup.position.set(0, 40, 0);

          enemyLasers.forEach(p => scene.remove(p)); enemyLasers = [];
          friendlyLasers.forEach(b => scene.remove(b)); friendlyLasers = [];
          enemies.forEach((drone, idx) => resetObjectMatrix(drone, -100 - (idx * 60)));
          clouds.forEach((cloud, idx) => cloud.position.set((Math.random() - 0.5) * 400, Math.random() * 60 + 15, -Math.random() * 600 - 50));
      }

      animate();
    </script>
  </body>
</html>
